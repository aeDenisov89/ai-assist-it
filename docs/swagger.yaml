definitions:
  models.CreateTodoRequest:
    properties:
      description:
        description: Подробное описание задачи, максимально 1000 символов
        maxLength: 1000
        type: string
      done:
        description: Статус выполнения задачи
        type: boolean
      title:
        description: Название задачи, обязательное, максимум 200 символов
        maxLength: 200
        type: string
      user_id:
        description: ID пользователя, обязательное поле
        type: integer
    required:
    - title
    - user_id
    type: object
  models.CreateUserRequest:
    properties:
      email:
        description: Электронная почта, обязательное поле, должна быть валидной
        type: string
      name:
        description: Имя пользователя, обязательное поле, максимум 100 символов
        maxLength: 100
        type: string
    required:
    - email
    - name
    type: object
  models.ErrorResponse:
    properties:
      error:
        description: Тип ошибки
        type: string
      message:
        description: Описание ошибки
        type: string
    type: object
  models.SuccessResponse:
    properties:
      data:
        description: 'Данные ответа: объект или список, опционально'
      success:
        description: Признак успешного ответа
        type: boolean
    type: object
  models.UpdateTodoRequest:
    properties:
      description:
        description: Новое описание задачи, опционально, максимум 1000 символов
        maxLength: 1000
        type: string
      done:
        description: Новый статус задачи, опционально
        type: boolean
      title:
        description: Новое название задачи, опционально, максимум 200 символов
        maxLength: 200
        type: string
    type: object
  models.UpdateUserRequest:
    properties:
      email:
        description: Электронная почта, опциональное поле, должна быть валидной
        type: string
      name:
        description: Имя пользователя, опциональное поле, максимум 100 символов
        maxLength: 100
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: REST API для управления пользователями и задачами
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Todo API
  version: "1.0"
paths:
  /api/v1/todos:
    get:
      description: Возвращает все задачи
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Список задач
      tags:
      - todos
    post:
      consumes:
      - application/json
      description: Создаёт новую задачу с указанными данными
      parameters:
      - description: Данные новой задачи
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/models.CreateTodoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Невалидный запрос
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Создать задачу
      tags:
      - todos
  /api/v1/todos/{id}:
    delete:
      description: Удаляет задачу с указанным ID
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Задача удалена
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Задача не найдена
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Удалить задачу
      tags:
      - todos
    get:
      description: Возвращает задачу с указанным ID
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Задача не найдена
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Получить задачу
      tags:
      - todos
    put:
      consumes:
      - application/json
      description: Обновляет данные задачи с указанным ID
      parameters:
      - description: ID задачи
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные задачи
        in: body
        name: todo
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTodoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Неверный ID или невалидный запрос
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Задача не найдена
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Обновить задачу
      tags:
      - todos
  /api/v1/users:
    get:
      description: Возвращает всех пользователей системы
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Список пользователей
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя с указанными данными
      parameters:
      - description: Данные нового пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Невалидный запрос
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Создать пользователя
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      description: Удаляет пользователя с указанным ID
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Пользователь удалён
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Удалить пользователя
      tags:
      - users
    get:
      description: Возвращает пользователя с указанным ID
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Получить пользователя
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет данные пользователя с указанным ID
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные пользователя
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Неверный ID или невалидный запрос
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Обновить пользователя
      tags:
      - users
swagger: "2.0"
